    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
