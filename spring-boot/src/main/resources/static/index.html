<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNEMO — Console de testes</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#3056d3; --err:#c62828; --ok:#2e7d32; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; margin-right:auto; }
  main { padding:24px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); max-width:1400px; margin:0 auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  section.wide { grid-column:1 / -1; }
  h2 { font-size:15px; margin:0 0 12px; }
  form { display:grid; gap:8px; }
  label { display:grid; gap:2px; font-size:12px; color:var(--muted); }
  input, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button.secondary { background:#fff; color:var(--fg); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:end; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  td.num { font-variant-numeric:tabular-nums; }
  #log { font:12px/1.4 ui-monospace, monospace; max-height:220px; overflow:auto; white-space:pre-wrap; margin:0; }
  .err { color:var(--err); } .ok { color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>MNEMO — Console de testes</h1>
  <button id="btnSeed">Popular banco (seed)</button>
  <button class="secondary" id="btnRefresh">Recarregar tudo</button>
</header>

<main>
  <section>
    <h2>Nova matéria</h2>
    <form id="formMateria">
      <label>Nome <input name="nome" required></label>
      <label>Data da prova (opcional) <input name="data_prova" type="date"></label>
      <button>Criar matéria</button>
    </form>
  </section>

  <section>
    <h2>Novo tópico</h2>
    <form id="formTopico">
      <label>Nome <input name="nome" required></label>
      <label>Matéria <select name="materia" required></select></label>
      <label>Última vez visto <input name="ultima_vez_visto" type="date" required></label>
      <div class="row">
        <label>Nível (0–4) <input name="nivel" type="number" min="0" max="4" value="0" required></label>
        <label>Dificuldade (0–1) <input name="dificuldade" type="number" min="0" max="1" step="0.05" value="0.5" required></label>
      </div>
      <button>Criar tópico</button>
    </form>
  </section>

  <section class="wide">
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0; margin-right:auto">Ranking</h2>
      <label>Data de referência <input id="rankingDate" type="date"></label>
      <button id="btnRanking">Calcular</button>
    </div>
    <table>
      <thead><tr><th>#</th><th>Tópico</th><th>Matéria</th><th>Prova</th><th>Última vez</th><th>Nível</th><th>Dif.</th><th>Score</th></tr></thead>
      <tbody id="tbRanking"></tbody>
    </table>
  </section>

  <section>
    <h2>Matérias</h2>
    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>Prova</th></tr></thead>
      <tbody id="tbMaterias"></tbody>
    </table>
  </section>

  <section>
    <h2>Tópicos</h2>
    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>Matéria</th><th>Última vez</th><th>Nível</th><th>Dif.</th></tr></thead>
      <tbody id="tbTopicos"></tbody>
    </table>
  </section>

  <section class="wide">
    <h2>Log de requisições</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
  const $ = (sel) => document.querySelector(sel);
  const todayIso = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD no fuso local

  // input[type=date] usa ISO (YYYY-MM-DD); o back-end espera dd/MM/yyyy no corpo JSON
  const isoToBr = (iso) => iso ? iso.split('-').reverse().join('/') : null;
  const esc = (s) => String(s ?? '—').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  function log(msg, cls = '') {
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    $('#log').prepend(line);
  }

  async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(path, opts);
    const text = await res.text();
    const data = text ? (() => { try { return JSON.parse(text); } catch { return text; } })() : null;
    if (!res.ok) {
      log(`${method} ${path} → ${res.status}\n${typeof data === 'string' ? data : JSON.stringify(data, null, 2)}`, 'err');
      throw new Error(`HTTP ${res.status}`);
    }
    log(`${method} ${path} → ${res.status}${body ? '\n  body: ' + JSON.stringify(body) : ''}`, 'ok');
    return data;
  }

  async function loadMaterias() {
    const materias = await api('GET', '/materia');
    $('#tbMaterias').innerHTML = materias.map(m =>
      `<tr><td>${m.id}</td><td>${esc(m.nome)}</td><td>${esc(m.data_prova)}</td></tr>`).join('');
    const sel = $('#formTopico select[name=materia]');
    const prev = sel.value;
    sel.innerHTML = materias.map(m => `<option value="${m.id}">${esc(m.nome)}</option>`).join('');
    if (prev) sel.value = prev;
  }

  async function loadTopicos() {
    const topicos = await api('GET', '/topico');
    $('#tbTopicos').innerHTML = topicos.map(t =>
      `<tr><td>${t.id}</td><td>${esc(t.nome)}</td><td>${esc(t.materia?.nome)}</td>
       <td>${esc(t.ultima_vez_visto)}</td><td class="num">${t.nivel}</td><td class="num">${t.dificuldade}</td></tr>`).join('');
  }

  async function loadRanking() {
    const date = $('#rankingDate').value;
    const ranking = await api('GET', '/ranking' + (date ? `?date=${date}` : ''));
    $('#tbRanking').innerHTML = ranking.map((r, i) => {
      const t = r.topico;
      return `<tr><td>${i + 1}</td><td>${esc(t.nome)}</td><td>${esc(t.materia?.nome)}</td>
        <td>${esc(t.materia?.data_prova)}</td><td>${esc(t.ultima_vez_visto)}</td>
        <td class="num">${t.nivel}</td><td class="num">${t.dificuldade}</td>
        <td class="num"><strong>${r.score.toFixed(3)}</strong></td></tr>`;
    }).join('');
  }

  async function refreshAll() {
    try {
      await loadMaterias();
      await loadTopicos();
      await loadRanking();
    } catch (e) { /* já logado */ }
  }

  $('#formMateria').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    try {
      await api('POST', '/materia', { nome: f.get('nome'), data_prova: isoToBr(f.get('data_prova')) });
      ev.target.reset();
      refreshAll();
    } catch (e) {}
  });

  $('#formTopico').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    try {
      await api('POST', '/topico', {
        nome: f.get('nome'),
        ultima_vez_visto: isoToBr(f.get('ultima_vez_visto')),
        nivel: Number(f.get('nivel')),
        dificuldade: Number(f.get('dificuldade')),
        materia: { id: Number(f.get('materia')) },
      });
      ev.target.elements.nome.value = '';
      refreshAll();
    } catch (e) {}
  });

  $('#btnSeed').addEventListener('click', async () => {
    try { await api('POST', '/test/seedDataBase'); refreshAll(); } catch (e) {}
  });
  $('#btnRefresh').addEventListener('click', refreshAll);
  $('#btnRanking').addEventListener('click', () => loadRanking().catch(() => {}));

  $('#rankingDate').value = todayIso();
  $('#formTopico input[name=ultima_vez_visto]').value = todayIso();
  refreshAll();
</script>
</body>
</html>
